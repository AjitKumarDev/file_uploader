<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>proj 🚀</title>
  <style>
    *{
      margin: 0;
      padding: 0;
    }
    body{
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #main{
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      
    }
    #fileinp{
      display: none;
    }

    #btn{
      background-color: brown;
      padding: 15px 20px;
      border-radius: 30px;
      font-family: 'Times New Roman', Times, serif;
      font-weight: 700;
      font-size: 18px;
      color: aliceblue;
    }

  </style>
</head>
<body>
  <div id="main">
    <input type="file" id="fileinp">
    <div id="btn">
      Upload File
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
